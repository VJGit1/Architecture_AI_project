<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room fit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f4f1;
            --panel: #fbfaf8;
            --ink: #1c1b19;
            --ink-2: #5d5953;
            --ink-3: #8d8880;
            --line: #e4e0d9;
            --line-strong: #d4cfc6;
            --pass: #2f7a4d;
            --pass-soft: #e6f0e9;
            --rust: #a35a3c;
            --rust-soft: #f3e8e2;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        .num { font-variant-numeric: tabular-nums; }

        .studio {
            display: grid;
            grid-template-rows: 52px minmax(0, 1fr);
            height: 100vh;
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--line);
        }

        .bar .title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
        .bar .house { margin-left: 12px; color: var(--ink-3); font-size: 13px; }
        .bar-right { display: flex; align-items: center; gap: 16px; color: var(--ink-3); font-size: 12px; }

        .text-button {
            background: none;
            border: 0;
            color: var(--ink-2);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: var(--line-strong);
        }
        .text-button:hover { color: var(--ink); }

        .stage {
            display: grid;
            grid-template-columns: minmax(0, 7fr) minmax(340px, 3fr);
            min-height: 0;
        }

        .viewport { position: relative; min-height: 0; overflow: hidden; }
        #c { display: block; width: 100%; height: 100%; }

        #labels { position: absolute; inset: 0; pointer-events: none; }

        .wall-label {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: var(--ink-3);
            white-space: nowrap;
        }

        .callout {
            position: absolute;
            transform: translate(-50%, calc(-100% - 10px));
            max-width: 240px;
            padding: 7px 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid var(--rust);
            border-radius: var(--radius);
            box-shadow: 0 4px 16px rgba(28, 27, 25, 0.08);
            font-size: 12px;
            color: var(--ink);
        }
        .callout b { display: block; font-weight: 600; color: var(--rust); }

        .hover-tag {
            position: absolute;
            transform: translate(12px, 12px);
            padding: 6px 9px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 4px 14px rgba(28, 27, 25, 0.06);
            font-size: 12px;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }
        .hover-tag span { color: var(--ink-3); }

        .viewport-note {
            position: absolute;
            left: 20px;
            bottom: 16px;
            font-size: 11px;
            color: var(--ink-3);
        }

        .rail {
            min-height: 0;
            overflow-y: auto;
            background: var(--panel);
            border-left: 1px solid var(--line);
        }

        .rail form { display: flex; flex-direction: column; min-height: 100%; }

        .block { padding: 18px 20px; border-bottom: 1px solid var(--line); }
        .block[hidden] { display: none; }

        .block h2, .block h3 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-2);
        }

        .fields { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 12px; color: var(--ink-2); }
        .field .input-wrap {
            display: flex;
            align-items: center;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: #fff;
            padding: 0 9px;
        }
        .field .input-wrap:focus-within { border-color: var(--ink); }
        .field input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            padding: 8px 0;
            font: inherit;
            font-variant-numeric: tabular-nums;
            background: transparent;
            color: var(--ink);
        }
        .field .unit { color: var(--ink-3); font-size: 12px; }
        .field.needs .input-wrap { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(28, 27, 25, 0.06); }

        .intro { margin-top: 12px; color: var(--ink-2); }

        .cart-head { display: flex; justify-content: space-between; align-items: baseline; }
        .cart-total { font-size: 13px; color: var(--ink-2); }
        .cart-total strong { font-weight: 600; color: var(--ink); }

        .budget-bar { height: 3px; margin-top: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
        .budget-bar span { display: block; height: 100%; width: 0; background: var(--pass); transition: width 0.3s ease; }
        .budget-bar.over span { background: var(--ink); }

        .cart-lines { list-style: none; margin-top: 6px; }
        .cart-line { padding: 12px 0; border-bottom: 1px solid var(--line); }
        .cart-line:last-child { border-bottom: 0; padding-bottom: 0; }
        .cart-line .top { display: flex; justify-content: space-between; gap: 12px; }
        .cart-line .name { font-weight: 500; }
        .cart-line .price { font-variant-numeric: tabular-nums; }
        .cart-line .meta { margin-top: 2px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
        .cart-line .reason { margin-top: 4px; font-size: 13px; color: var(--ink-2); }
        .cart-line .changed { margin-left: 6px; font-size: 11px; color: var(--ink-3); font-weight: 400; }

        .why { margin-top: 8px; color: var(--ink-2); }
        .fit-line { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 13px; color: var(--pass); }
        .fit-line::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--pass); flex: none; }
        .fit-line[hidden] { display: none; }

        .notice { padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 13px; }
        .notice[hidden] { display: none; }
        .notice.refused { color: var(--rust); background: var(--rust-soft); }
        .notice.issue { color: var(--ink); border-left: 3px solid var(--ink); }
        .notice.question { color: var(--ink); font-weight: 500; }

        .composer { padding: 18px 20px; border-bottom: 1px solid var(--line); }
        .composer textarea {
            width: 100%;
            min-height: 64px;
            resize: vertical;
            padding: 10px 11px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: #fff;
            font: inherit;
            color: var(--ink);
            outline: 0;
        }
        .composer textarea:focus { border-color: var(--ink); }
        .composer textarea::placeholder { color: var(--ink-3); }

        .composer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
        .status { font-size: 12px; color: var(--ink-2); min-height: 17px; }

        .primary {
            flex: none;
            padding: 9px 16px;
            border: 0;
            border-radius: var(--radius);
            background: var(--ink);
            color: var(--bg);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
        }
        .primary:hover { background: #33312d; }
        .primary:disabled { opacity: 0.55; cursor: default; }

        .trace { padding: 14px 20px 24px; }
        .trace summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--ink-2);
            list-style: none;
        }
        .trace summary::-webkit-details-marker { display: none; }
        .trace summary::before { content: '+ '; color: var(--ink-3); }
        .trace[open] summary::before { content: '\2212  '; }

        .trace-list { list-style: none; margin-top: 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; }
        .trace-list .turn { margin-top: 10px; color: var(--ink-3); font-family: 'Inter', system-ui, sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
        .trace-list .turn:first-child { margin-top: 0; }
        .trace-row { padding: 3px 0; color: var(--ink-2); word-break: break-word; }
        .trace-row .tool { color: var(--ink); font-weight: 600; }
        .trace-row .arrow { color: var(--ink-3); }
        .trace-row.failed .obs { color: var(--ink); }
        .trace-row .tag { color: var(--ink-3); }

        @media (max-width: 900px) {
            .studio { height: auto; min-height: 100vh; }
            .stage { grid-template-columns: 1fr; }
            .viewport { height: 58vh; }
            .rail { border-left: 0; border-top: 1px solid var(--line); }
        }
    </style>
</head>
<body>
    <div class="studio">
        <header class="bar">
            <div><span class="title">Room fit</span><span class="house">Harbor &amp; Co. sample catalog</span></div>
            <div class="bar-right">
                <span id="store-status">Connecting to the catalog.</span>
                <button type="button" id="new-room" class="text-button">New room</button>
            </div>
        </header>

        <main class="stage">
            <section class="viewport" id="viewport">
                <canvas id="c"></canvas>
                <div id="labels"></div>
                <div id="hover-tag" class="hover-tag"></div>
                <div class="viewport-note">Drag to orbit. Scroll to zoom.</div>
            </section>

            <aside class="rail">
                <form id="brief-form" autocomplete="off">
                    <section class="block">
                        <div class="fields">
                            <div class="field" id="field-width">
                                <label for="f-width">Width</label>
                                <div class="input-wrap"><input id="f-width" inputmode="decimal"><span class="unit unit-len">ft</span></div>
                            </div>
                            <div class="field" id="field-length">
                                <label for="f-length">Length</label>
                                <div class="input-wrap"><input id="f-length" inputmode="decimal"><span class="unit unit-len">ft</span></div>
                            </div>
                            <div class="field" id="field-budget">
                                <label for="f-budget">Budget</label>
                                <div class="input-wrap"><span class="unit">$</span><input id="f-budget" inputmode="numeric"></div>
                            </div>
                        </div>
                        <p class="intro" id="intro">Describe the room you already have, and Room fit will fill it with Harbor &amp; Co. pieces that fit the walls and stay under budget.</p>
                    </section>

                    <section class="block" id="cart-block" hidden>
                        <div class="cart-head">
                            <h2>Cart</h2>
                            <div class="cart-total num"><strong id="cart-total">$0</strong> of <span id="cart-budget">$0</span></div>
                        </div>
                        <div class="budget-bar" id="budget-bar"><span></span></div>
                        <ul class="cart-lines" id="cart-lines"></ul>
                    </section>

                    <section class="block" id="why-block" hidden>
                        <h3>Why this set</h3>
                        <p class="why" id="why"></p>
                        <p class="fit-line" id="fit-line" hidden></p>
                    </section>

                    <p class="notice refused" id="refused-line" hidden></p>
                    <p class="notice issue" id="issue-line" hidden></p>
                    <p class="notice question" id="question-line" hidden></p>

                    <section class="composer">
                        <textarea id="message" rows="2" placeholder="Living room is 14 by 16 feet, budget 3000, we watch TV and have a dog."></textarea>
                        <div class="composer-row">
                            <p class="status" id="status"></p>
                            <button type="submit" class="primary" id="fit-btn">Fit the room</button>
                        </div>
                    </section>

                    <details class="trace" id="trace-block">
                        <summary>How this was chosen</summary>
                        <ol class="trace-list" id="trace-list"></ol>
                    </details>
                </form>
            </aside>
        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const SESSION_KEY = 'roomfit.session';
        const WALL_HEIGHT = 0.6;
        const WALL_THICKNESS = 0.2;
        const M_TO_IN = 39.3701;
        const M_TO_FT = 3.28084;
        const COMPASS = { back: 'North', front: 'South', left: 'West', right: 'East' };

        const ui = {
            form: document.getElementById('brief-form'),
            width: document.getElementById('f-width'),
            length: document.getElementById('f-length'),
            budget: document.getElementById('f-budget'),
            intro: document.getElementById('intro'),
            cartBlock: document.getElementById('cart-block'),
            cartTotal: document.getElementById('cart-total'),
            cartBudget: document.getElementById('cart-budget'),
            budgetBar: document.getElementById('budget-bar'),
            cartLines: document.getElementById('cart-lines'),
            whyBlock: document.getElementById('why-block'),
            why: document.getElementById('why'),
            fitLine: document.getElementById('fit-line'),
            refused: document.getElementById('refused-line'),
            issue: document.getElementById('issue-line'),
            question: document.getElementById('question-line'),
            message: document.getElementById('message'),
            status: document.getElementById('status'),
            button: document.getElementById('fit-btn'),
            traceList: document.getElementById('trace-list'),
            storeStatus: document.getElementById('store-status'),
            newRoom: document.getElementById('new-room'),
            labels: document.getElementById('labels'),
            hoverTag: document.getElementById('hover-tag')
        };

        const usd = n => `$${Math.round(n).toLocaleString('en-US')}`;
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // ---------------------------------------------------------------
        // Three.js viewport
        // ---------------------------------------------------------------
        const canvas = document.getElementById('c');
        const viewportEl = document.getElementById('viewport');
        const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf6f4f1);

        const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
        camera.position.set(7, 8, 9);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 3;
        controls.maxDistance = 30;
        controls.maxPolarAngle = Math.PI / 2 - 0.08;
        controls.target.set(0, 0.3, 0);

        scene.add(new THREE.HemisphereLight(0xffffff, 0xe6e0d6, 1.15));
        const sun = new THREE.DirectionalLight(0xfffaf2, 1.6);
        sun.position.set(-6, 12, -4);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -10;
        sun.shadow.camera.right = 10;
        sun.shadow.camera.top = 10;
        sun.shadow.camera.bottom = -10;
        sun.shadow.radius = 6;
        sun.shadow.bias = -0.0004;
        scene.add(sun);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(80, 80),
            new THREE.ShadowMaterial({ color: 0x1c1b19, opacity: 0.1 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.002;
        ground.receiveShadow = true;
        scene.add(ground);

        scene.fog = new THREE.Fog(0xf6f4f1, 18, 42);
        const grid = new THREE.GridHelper(40, 131, 0xe9e5df, 0xece9e3);
        grid.position.y = -0.003;
        scene.add(grid);

        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        const PALETTE = {
            Harbor: { fabric: 0xd8d0c2, wood: 0xc6a77f, rug: 0xe6dfd3 },
            Field: { fabric: 0xb8a790, wood: 0xa27f5c, rug: 0xd2c5b1 },
            Loft: { fabric: 0x9e9d99, wood: 0x4c4945, rug: 0xcac8c3 }
        };
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x1c1b19, transparent: true, opacity: 0.14 });

        function material(color, roughness = 0.92) {
            return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });
        }

        function block(w, h, d, mat, x = 0, y = 0, z = 0, castShadow = true) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = castShadow;
            mesh.receiveShadow = true;
            mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), edgeMaterial));
            return mesh;
        }

        // Catalog blocks at the SKU's real width (x), depth (z), and height. Local +z is the front.
        function buildPiece(item) {
            const g = new THREE.Group();
            const w = item.width;
            const d = item.length;
            const h = item.height;
            const pal = PALETTE[item.collection] || PALETTE.Harbor;
            const fabric = material(pal.fabric);
            const wood = material(pal.wood, 0.7);

            if (item.type === 'sofa' || item.type === 'sectional' || item.type === 'chair') {
                const arm = Math.min(0.16, w * 0.09);
                const back = Math.min(0.22, d * 0.24);
                const mainDepth = item.type === 'sectional' ? Math.min(0.98, d) : d;
                const z0 = -d / 2;
                g.add(block(w, h, back, fabric, 0, h / 2, z0 + back / 2));
                g.add(block(w - 2 * arm, 0.42, mainDepth - back, fabric, 0, 0.21, z0 + back + (mainDepth - back) / 2));
                g.add(block(arm, 0.62, mainDepth, fabric, -w / 2 + arm / 2, 0.31, z0 + mainDepth / 2));
                if (item.type === 'sectional') {
                    const chaiseW = Math.min(0.95, w * 0.36);
                    const chaiseD = d - mainDepth;
                    g.add(block(chaiseW, 0.42, chaiseD, fabric, w / 2 - arm - chaiseW / 2, 0.21, z0 + mainDepth + chaiseD / 2));
                    g.add(block(arm, 0.62, d, fabric, w / 2 - arm / 2, 0.31, 0));
                } else {
                    g.add(block(arm, 0.62, mainDepth, fabric, w / 2 - arm / 2, 0.31, z0 + mainDepth / 2));
                }
            } else if (item.type === 'coffee_table') {
                const round = /round/i.test(item.name || '');
                if (round) {
                    const top = new THREE.Mesh(new THREE.CylinderGeometry(w / 2, w / 2, 0.05, 48), wood);
                    top.position.y = h - 0.025;
                    top.castShadow = true;
                    g.add(top);
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(w * 0.22, w * 0.26, h - 0.05, 32), wood);
                    base.position.y = (h - 0.05) / 2;
                    base.castShadow = true;
                    g.add(base);
                } else {
                    g.add(block(w, 0.05, d, wood, 0, h - 0.025, 0));
                    const leg = 0.05;
                    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
                        g.add(block(leg, h - 0.05, leg, wood, sx * (w / 2 - 0.05), (h - 0.05) / 2, sz * (d / 2 - 0.05)));
                    });
                }
            } else if (item.type === 'media') {
                g.add(block(w, h, d, wood, 0, h / 2, 0));
                const tvW = Math.min(w * 0.85, 1.65);
                g.add(block(tvW, tvW * 0.56, 0.04, material(0x3a3936, 0.45), 0, h + 0.08 + tvW * 0.28, -d / 2 + 0.08));
            } else if (item.type === 'rug') {
                g.add(block(w, 0.012, d, material(pal.rug, 1), 0, 0.006, 0, false));
            } else if (item.type === 'bed') {
                g.add(block(w, 0.3, d, wood, 0, 0.15, 0));
                g.add(block(w - 0.06, 0.24, d - 0.14, material(0xf3f0ea), 0, 0.42, 0.04));
                g.add(block(w, h, 0.08, fabric, 0, h / 2, -d / 2 + 0.04));
                const pw = Math.min(0.62, (w - 0.2) / 2);
                [-1, 1].forEach(s => g.add(block(pw, 0.12, 0.38, material(0xfbfaf8), s * (pw / 2 + 0.04), 0.6, -d / 2 + 0.32)));
            } else if (item.type === 'nightstand') {
                g.add(block(w, h, d, wood, 0, h / 2, 0));
            } else {
                g.add(block(w, h, d, material(0xd9d4cc), 0, h / 2, 0));
            }

            g.position.set(item.x || 0, 0, item.z || 0);
            g.rotation.y = item.rotationY || 0;
            g.userData = { slot: item.slot, name: item.name, width: w, depth: d, height: h };
            return g;
        }

        function disposeGroup(group) {
            group.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material && obj.material !== edgeMaterial) {
                    (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => m.dispose());
                }
            });
            while (group.children.length) group.remove(group.children[0]);
        }

        // Floor, walls cut low so the room reads from above, and door gaps with swing arcs.
        function buildRoom(room, openings) {
            const floorMat = material(0xdccdb6, 0.85);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(room.width, room.length), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(room.x, 0.001, room.z);
            floor.receiveShadow = true;
            roomGroup.add(floor);

            const wallMat = material(0xfbfaf7, 0.96);
            const half = { w: room.width / 2, l: room.length / 2 };
            const walls = room.walls || [];

            walls.forEach(wall => {
                const along = wall.position === 'back' || wall.position === 'front' ? 'x' : 'z';
                const length = along === 'x' ? room.width + WALL_THICKNESS : room.length - WALL_THICKNESS;
                const center = along === 'x' ? room.x : room.z;
                const fixed = { back: room.z - half.l, front: room.z + half.l, left: room.x - half.w, right: room.x + half.w }[wall.position];

                const gaps = openings.filter(o => o.wallId === wall.id && o.type === 'door').map(o => {
                    const t = (along === 'x' ? o.x : o.z) - center;
                    return [t - o.width / 2, t + o.width / 2];
                }).sort((a, b) => a[0] - b[0]);

                let start = -length / 2;
                const segments = [];
                gaps.forEach(([a, b]) => { if (a > start) segments.push([start, a]); start = Math.max(start, b); });
                if (start < length / 2) segments.push([start, length / 2]);

                segments.forEach(([a, b]) => {
                    const segLen = b - a;
                    const mid = center + (a + b) / 2;
                    const mesh = along === 'x'
                        ? block(segLen, WALL_HEIGHT, WALL_THICKNESS, wallMat, mid, WALL_HEIGHT / 2, fixed)
                        : block(WALL_THICKNESS, WALL_HEIGHT, segLen, wallMat, fixed, WALL_HEIGHT / 2, mid);
                    roomGroup.add(mesh);
                });
            });

            openings.filter(o => o.type === 'door').forEach(o => {
                const wall = walls.find(w => w.id === o.wallId);
                if (!wall) return;
                const pos = wall.position;
                const into = { back: [0, 1], front: [0, -1], left: [1, 0], right: [-1, 0] }[pos];
                const alongDir = pos === 'back' || pos === 'front' ? [1, 0] : [0, 1];
                const hinge = [o.x - alongDir[0] * o.width / 2, o.z - alongDir[1] * o.width / 2];
                const pts = [];
                for (let i = 0; i <= 32; i++) {
                    const a = (i / 32) * Math.PI / 2;
                    const u = Math.cos(a) * o.width;
                    const v = Math.sin(a) * o.width;
                    pts.push(new THREE.Vector3(hinge[0] + alongDir[0] * u + into[0] * v, 0.004, hinge[1] + alongDir[1] * u + into[1] * v));
                }
                const shape = new THREE.Shape();
                shape.moveTo(hinge[0], -hinge[1]);
                pts.forEach(p => shape.lineTo(p.x, -p.z));
                shape.lineTo(hinge[0], -hinge[1]);
                const swing = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0x1c1b19, transparent: true, opacity: 0.05, depthWrite: false }));
                swing.rotation.x = -Math.PI / 2;
                swing.position.y = 0.003;
                roomGroup.add(swing);

                const lineMat = new THREE.LineBasicMaterial({ color: 0x1c1b19, transparent: true, opacity: 0.35 });
                roomGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
                const leafEnd = pts[pts.length - 1];
                roomGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(hinge[0], 0.004, hinge[1]), leafEnd]), lineMat));
            });
        }

        // Rust dashed outline of a refused piece at the wall or door that refused it.
        function buildRefusalGhost(refused, room) {
            if (!refused || !refused.anchor) return null;
            const a = refused.anchor;
            let center;
            let w;
            let d;
            let alongX;
            if (a.type === 'door' && a.x !== undefined) {
                center = new THREE.Vector3(a.x, 0, a.z);
                w = 0.9; d = 0.9;
                alongX = a.wall === 'back' || a.wall === 'front';
                const inward = { back: [0, 0.45], front: [0, -0.45], left: [0.45, 0], right: [-0.45, 0] }[a.wall] || [0, 0];
                center.x += inward[0];
                center.z += inward[1];
            } else {
                const wall = a.wall || 'back';
                alongX = wall === 'back' || wall === 'front';
                w = refused.width || 1;
                d = refused.depth || 0.9;
                const inset = 0.12 + d / 2;
                const half = { w: room.width / 2, l: room.length / 2 };
                center = {
                    back: new THREE.Vector3(room.x, 0, room.z - half.l + inset),
                    front: new THREE.Vector3(room.x, 0, room.z + half.l - inset),
                    left: new THREE.Vector3(room.x - half.w + inset, 0, room.z),
                    right: new THREE.Vector3(room.x + half.w - inset, 0, room.z)
                }[wall];
            }
            const hx = (alongX ? w : d) / 2;
            const hz = (alongX ? d : w) / 2;
            const y = 0.02;
            const pts = [
                new THREE.Vector3(center.x - hx, y, center.z - hz),
                new THREE.Vector3(center.x + hx, y, center.z - hz),
                new THREE.Vector3(center.x + hx, y, center.z + hz),
                new THREE.Vector3(center.x - hx, y, center.z + hz),
                new THREE.Vector3(center.x - hx, y, center.z - hz)
            ];
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0xa35a3c, dashSize: 0.12, gapSize: 0.08 }));
            line.computeLineDistances();
            return { line, labelAt: new THREE.Vector3(center.x, WALL_HEIGHT + 0.25, center.z) };
        }

        const overlayLabels = [];
        function clearLabels() {
            overlayLabels.length = 0;
            ui.labels.innerHTML = '';
        }

        function addLabel(html, position, className) {
            const el = document.createElement('div');
            el.className = className;
            el.innerHTML = html;
            ui.labels.appendChild(el);
            overlayLabels.push({ el, position });
        }

        let framedRoomKey = null;
        const furnitureGroup = new THREE.Group();
        scene.add(furnitureGroup);

        function renderScene(view, state) {
            disposeGroup(roomGroup);
            disposeGroup(furnitureGroup);
            clearLabels();
            if (!view || !view.room || !state) return;

            const room = (state.rooms || []).find(r => r.id === view.room.id);
            if (!room) return;
            const wallIds = new Set((room.walls || []).map(w => w.id));
            const openings = (state.openings || []).filter(o => wallIds.has(o.wallId));
            const furniture = (state.furniture || []).filter(f => f.roomId === room.id);

            buildRoom(room, openings);
            furniture.forEach(f => furnitureGroup.add(buildPiece(f)));

            const ft = view.brief.unit !== 'm';
            const wallText = len => ft ? `${(len * M_TO_FT).toFixed(len * M_TO_FT % 1 < 0.05 ? 0 : 1)} ft · ${len.toFixed(2)} m` : `${len.toFixed(2)} m`;
            const off = 0.55;
            const half = { w: room.width / 2, l: room.length / 2 };
            addLabel(`North wall · ${wallText(room.width)}`, new THREE.Vector3(room.x, 0, room.z - half.l - off), 'wall-label');
            addLabel(`South wall · ${wallText(room.width)}`, new THREE.Vector3(room.x, 0, room.z + half.l + off), 'wall-label');
            addLabel(`West wall · ${wallText(room.length)}`, new THREE.Vector3(room.x - half.w - off, 0, room.z), 'wall-label');
            addLabel(`East wall · ${wallText(room.length)}`, new THREE.Vector3(room.x + half.w + off, 0, room.z), 'wall-label');

            const ghost = buildRefusalGhost(view.refused, room);
            if (ghost) {
                roomGroup.add(ghost.line);
                addLabel(`<b>Refused</b>${esc(view.refused.message)}`, ghost.labelAt, 'callout');
            }

            const key = `${room.id}`;
            if (framedRoomKey !== key) {
                framedRoomKey = key;
                const span = Math.max(room.width, room.length);
                controls.target.set(room.x, 0.3, room.z);
                const dir = new THREE.Vector3(0.62, 0.95, 1.0).normalize();
                camera.position.copy(controls.target).addScaledVector(dir, span * 1.55 + 2.2);
                controls.update();
            }
        }

        function updateLabels() {
            const rect = canvas.getBoundingClientRect();
            const v = new THREE.Vector3();
            overlayLabels.forEach(({ el, position }) => {
                v.copy(position).project(camera);
                const visible = v.z < 1;
                el.style.display = visible ? 'block' : 'none';
                el.style.left = `${(v.x * 0.5 + 0.5) * rect.width}px`;
                el.style.top = `${(-v.y * 0.5 + 0.5) * rect.height}px`;
            });
        }

        // Hover shows the SKU name, size, and price for a placed piece.
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let currentView = null;
        canvas.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hit = raycaster.intersectObjects(furnitureGroup.children, true)[0];
            let obj = hit ? hit.object : null;
            while (obj && !obj.userData.slot) obj = obj.parent;
            const line = obj && currentView ? currentView.cart.find(l => l.slot === obj.userData.slot) : null;
            if (!line) {
                ui.hoverTag.style.display = 'none';
                return;
            }
            ui.hoverTag.innerHTML = `${esc(line.sku.name)} <span class="num">${dims(line.sku, currentView.brief)} · ${usd(line.sku.price)}</span>`;
            ui.hoverTag.style.left = `${e.clientX - rect.left}px`;
            ui.hoverTag.style.top = `${e.clientY - rect.top}px`;
            ui.hoverTag.style.display = 'block';
        });
        canvas.addEventListener('pointerleave', () => { ui.hoverTag.style.display = 'none'; });

        function resize() {
            const w = viewportEl.clientWidth;
            const h = viewportEl.clientHeight;
            if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
                renderer.setSize(w, h, false);
                camera.aspect = w / Math.max(1, h);
                camera.updateProjectionMatrix();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            resize();
            controls.update();
            renderer.render(scene, camera);
            updateLabels();
        }

        // ---------------------------------------------------------------
        // Rail
        // ---------------------------------------------------------------
        function dims(sku, brief) {
            if (brief && brief.unit === 'm') {
                return `${sku.width.toFixed(2)} × ${sku.depth.toFixed(2)} × ${sku.height.toFixed(2)} m`;
            }
            const inch = v => Math.round(v * M_TO_IN);
            return sku.role === 'rug'
                ? `${(sku.width * M_TO_FT).toFixed(0)} × ${(sku.depth * M_TO_FT).toFixed(0)} ft`
                : `${inch(sku.width)} W × ${inch(sku.depth)} D × ${inch(sku.height)} H in`;
        }

        function setFieldUnits(unit) {
            document.querySelectorAll('.unit-len').forEach(el => { el.textContent = unit === 'm' ? 'm' : 'ft'; });
        }

        function fillFields(brief) {
            if (!brief) return;
            const unit = brief.unit === 'm' ? 'm' : 'ft';
            setFieldUnits(unit);
            const show = (m, displayVal) => {
                if (!m) return '';
                if (displayVal !== undefined && displayVal !== null) return String(displayVal);
                return unit === 'ft' ? (m * M_TO_FT).toFixed(1).replace(/\.0$/, '') : String(m);
            };
            ui.width.value = show(brief.width, brief.display && brief.display.width);
            ui.length.value = show(brief.length, brief.display && brief.display.length);
            ui.budget.value = brief.budget ? String(brief.budget) : '';
        }

        function markMissing(view) {
            const missing = view && view.status === 'needs_input' ? {
                width: !view.brief.width, length: !view.brief.length, budget: !view.brief.budget
            } : {};
            document.getElementById('field-width').classList.toggle('needs', Boolean(missing.width));
            document.getElementById('field-length').classList.toggle('needs', Boolean(missing.length));
            document.getElementById('field-budget').classList.toggle('needs', Boolean(missing.budget));
        }

        function renderTrace(view) {
            const rows = (view && view.trace) || [];
            let html = '';
            let turn = null;
            rows.forEach(r => {
                if (r.turn !== turn) {
                    turn = r.turn;
                    html += `<li class="turn">Turn ${turn}</li>`;
                }
                html += traceRowHtml(r);
            });
            ui.traceList.innerHTML = html;
        }

        function traceRowHtml(r) {
            const failed = r.ok === false || /^fail|^no /.test(r.observation || '');
            const tag = r.repair ? ' <span class="tag">repair</span>' : '';
            return `<li class="trace-row${failed ? ' failed' : ''}"><span class="tool">${esc(r.tool)}</span> <span class="arg">${esc(r.arg)}</span> <span class="arrow">→</span> <span class="obs">${esc(r.observation)}</span>${tag}</li>`;
        }

        function renderRail(view) {
            currentView = view;
            const hasCart = view && view.cart && view.cart.length > 0;
            ui.intro.hidden = Boolean(view && (hasCart || view.status === 'needs_input' || view.openIssue));

            ui.cartBlock.hidden = !hasCart;
            if (hasCart) {
                ui.cartTotal.textContent = usd(view.total);
                ui.cartBudget.textContent = usd(view.budget);
                const over = view.total > view.budget;
                ui.budgetBar.classList.toggle('over', over);
                ui.budgetBar.firstElementChild.style.width = `${Math.min(100, (view.total / view.budget) * 100)}%`;

                const swappedThisTurn = new Set((view.trace || [])
                    .filter(t => t.turn === view.turn && t.tool === 'swap_sku' && t.ok && t.slot && t.newName)
                    .map(t => t.slot));
                ui.cartLines.innerHTML = view.cart.map(line => `
                    <li class="cart-line">
                        <div class="top">
                            <span class="name">${esc(line.sku.name)}${swappedThisTurn.has(line.slot) ? '<span class="changed">swapped in</span>' : ''}</span>
                            <span class="price">${usd(line.sku.price)}</span>
                        </div>
                        <div class="meta">${esc(line.slotLabel)} · ${dims(line.sku, view.brief)}</div>
                        <div class="reason">${esc(line.reason)}</div>
                    </li>`).join('');
            }

            const why = view && view.explanation && view.explanation.why;
            ui.whyBlock.hidden = !(why && hasCart);
            ui.why.textContent = why || '';
            const critique = view && view.critique;
            if (critique && critique.pass && hasCart) {
                const doors = (view.room && view.room.doors || []).map(d => d.compass).join(' and ');
                const parts = ['budget', 'every required piece', `the ${doors || 'room'} door`];
                if (critique.checks && critique.checks.facing && critique.checks.facing.pass) parts.push('sofa facing the TV');
                ui.fitLine.textContent = `Fits. Checked ${parts.slice(0, -1).join(', ')}, and ${parts[parts.length - 1]}.`;
                ui.fitLine.hidden = false;
            } else {
                ui.fitLine.hidden = true;
            }

            const refused = view && view.refused;
            ui.refused.hidden = !refused;
            if (refused) ui.refused.textContent = `Refused: ${refused.message}`;

            const issue = view && view.explanation && view.explanation.openIssue;
            ui.issue.hidden = !issue;
            if (issue) ui.issue.textContent = issue;

            ui.question.hidden = !(view && view.status === 'needs_input' && view.question);
            if (view && view.question) ui.question.textContent = view.question;

            markMissing(view);
            renderTrace(view);
        }

        function finalStatus(view) {
            if (!view) return '';
            const turnRows = (view.trace || []).filter(t => t.turn === view.turn);
            const repairs = turnRows.filter(t => t.repair).length;
            if (view.status === 'needs_input') return 'Waiting for your answer.';
            if (view.status === 'open_issue') return `Stopped after ${turnRows.length} steps with an open issue.`;
            if (view.status === 'blocked') return 'Stopped before the set was finished.';
            return `Finished in ${turnRows.length} steps${repairs ? ` with ${repairs} repair${repairs > 1 ? 's' : ''}` : ''}.`;
        }

        function resetStudio() {
            localStorage.removeItem(SESSION_KEY);
            sessionId = null;
            framedRoomKey = null;
            ui.width.value = '';
            ui.length.value = '';
            ui.budget.value = '';
            setFieldUnits('ft');
            renderRail(null);
            ui.intro.hidden = false;
            renderScene(null, null);
            ui.status.textContent = '';
            ui.message.focus();
        }

        // ---------------------------------------------------------------
        // Server
        // ---------------------------------------------------------------
        let sessionId = localStorage.getItem(SESSION_KEY);
        let busy = false;

        function readFields() {
            const num = el => {
                const v = parseFloat(String(el.value).replace(/[,$]/g, ''));
                return Number.isFinite(v) && v > 0 ? v : null;
            };
            const unit = document.querySelector('.unit-len').textContent === 'm' ? 'm' : 'ft';
            return { width: num(ui.width), length: num(ui.length), budget: num(ui.budget), unit };
        }

        async function submitTurn() {
            if (busy) return;
            const message = ui.message.value.trim();
            const fields = readFields();
            if (!message && !fields.width && !fields.budget) {
                ui.status.textContent = 'Add the room size and budget, or describe the room.';
                return;
            }

            busy = true;
            ui.button.disabled = true;
            ui.status.textContent = 'Reading the brief.';

            try {
                const res = await fetch('/api/shopper/turn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, message, fields, stream: true })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `The server answered ${res.status}.`);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let done = null;
                for (;;) {
                    const { value, done: finished } = await reader.read();
                    if (finished) break;
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf('\n')) >= 0) {
                        const line = buffer.slice(0, idx).trim();
                        buffer = buffer.slice(idx + 1);
                        if (!line) continue;
                        const evt = JSON.parse(line);
                        if (evt.type === 'step') ui.status.textContent = evt.status;
                        if (evt.type === 'trace') ui.traceList.insertAdjacentHTML('beforeend', traceRowHtml(evt.row));
                        if (evt.type === 'error') throw new Error(evt.error);
                        if (evt.type === 'done') done = evt;
                    }
                }
                if (!done) throw new Error('The turn ended without a result.');

                sessionId = done.session.id;
                localStorage.setItem(SESSION_KEY, sessionId);
                ui.message.value = '';
                fillFields(done.session.brief);
                renderRail(done.session);
                renderScene(done.session, done.state);
                ui.status.textContent = finalStatus(done.session);
            } catch (err) {
                ui.status.textContent = `That did not go through. ${err.message}`;
            } finally {
                busy = false;
                ui.button.disabled = false;
            }
        }

        ui.form.addEventListener('submit', (e) => {
            e.preventDefault();
            submitTurn();
        });
        ui.message.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitTurn();
            }
        });
        ui.newRoom.addEventListener('click', resetStudio);

        async function loadStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const count = data.catalog && data.catalog.count ? data.catalog.count : 0;
                ui.storeStatus.textContent = data.database && data.database.isConnected
                    ? `${count} products in Neo4j`
                    : `${count} products in memory`;
            } catch (_) {
                ui.storeStatus.textContent = 'Catalog unavailable.';
            }
        }

        async function loadSession() {
            if (!sessionId) {
                renderRail(null);
                return;
            }
            try {
                const res = await fetch(`/api/shopper/session/${encodeURIComponent(sessionId)}`);
                if (!res.ok) throw new Error('missing');
                const data = await res.json();
                fillFields(data.session.brief);
                renderRail(data.session);
                renderScene(data.session, data.state);
                ui.status.textContent = data.session.cart.length ? 'Loaded your saved room.' : '';
            } catch (_) {
                localStorage.removeItem(SESSION_KEY);
                sessionId = null;
                renderRail(null);
            }
        }

        animate();
        loadStatus();
        loadSession();
    </script>
</body>
</html>
